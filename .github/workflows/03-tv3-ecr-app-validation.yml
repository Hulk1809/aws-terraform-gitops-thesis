name: 03 - TV3 ECR and App Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tv3-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ecr-module-validation:
    name: Validate modules/ecr-registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: modules/ecr-registry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -diff

      - name: Initialize module
        run: terraform init -backend=false -input=false

      - name: Validate module
        run: terraform validate -no-color

  ecr-checkov:
    name: Checkov security scan (TV3 ECR)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan ECR module
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: modules/ecr-registry
          framework: terraform
          quiet: true
          soft_fail: false

  app-image-build:
    name: Build app-demo container
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --tag thesis-app:${{ github.sha }} app-demo
