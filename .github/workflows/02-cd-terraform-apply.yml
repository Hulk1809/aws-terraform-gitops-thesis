name: 02 - CD Terraform Apply
on:
  push:
    branches: [main]
    paths: ['modules/**', 'environments/prod/**', 'app-demo/**', '.github/workflows/02-cd-terraform-apply.yml', '.github/workflows/03-ecr-build-scan-push.yml']
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action (apply creates billable AWS resources)
        type: choice
        default: plan
        options: [plan, apply, destroy]
      confirmation:
        description: Type DESTROY to permanently delete prod resources and images
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: terraform-prod
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
  TF_VAR_image_tag: v-${{ github.sha }}
jobs:
  registry:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'push' && vars.AWS_AUTO_DEPLOY == 'true') || inputs.action == 'apply')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - run: terraform -chdir=environments/prod init -input=false
      # ponytail: targeted phase only bootstraps ECR; full plan/apply follows image publish.
      - run: terraform -chdir=environments/prod plan -target=module.ecr_registry -out=registry.tfplan -lock-timeout=5m
      - run: terraform -chdir=environments/prod apply registry.tfplan
  image:
    needs: registry
    uses: ./.github/workflows/03-ecr-build-scan-push.yml
    secrets: inherit
  terraform:
    needs: [registry, image]
    if: always() && github.ref == 'refs/heads/main' && ((needs.image.result == 'success' && needs.registry.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.action != 'apply'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: environments/prod
        shell: bash
    steps:
      - name: Confirm permanent teardown
        if: inputs.action == 'destroy'
        working-directory: .
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = DESTROY
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - run: terraform init -input=false
      - run: terraform fmt -check -recursive
      - run: terraform validate -no-color
      - name: Plan
        if: inputs.action != 'destroy'
        run: terraform plan -out=tfplan -lock-timeout=5m
      - name: Apply reviewed run plan
        if: inputs.action == 'apply' || github.event_name == 'push'
        run: terraform apply tfplan
      - name: Preview permanent teardown
        if: inputs.action == 'destroy'
        run: terraform plan -destroy -out=destroy.tfplan -lock-timeout=5m
      - name: Destroy prod only
        if: inputs.action == 'destroy'
        run: terraform apply destroy.tfplan
